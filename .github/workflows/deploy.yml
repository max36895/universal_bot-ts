name: Deploy umbot project

on:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'

            - name: Install dependencies
              run: npm install

            - name: Build project
              run: npm run build

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-umbot-bot:latest

            - name: Deploy to server via SSH
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.HOST }}
                  username: ${{ secrets.USERNAME }}
                  key: ${{ secrets.SSH_KEY }}
                  script: |
                      # Секреты передаются через env-файл на сервере, а не флагами -e,
                      # чтобы токены не были видны в `ps`, скрипте SSH-сессии и docker inspect.
                      # Создайте /etc/umbot/my-umbot-bot.env на сервере заранее (chmod 600).
                      docker stop my-umbot-bot || true
                      docker rm my-umbot-bot || true
                      docker pull ${{ secrets.DOCKERHUB_USERNAME }}/my-umbot-bot:latest
                      docker run -d \
                        --name my-umbot-bot \
                        --restart unless-stopped \
                        -p 3000:3000 \
                        --env-file /etc/umbot/my-umbot-bot.env \
                        ${{ secrets.DOCKERHUB_USERNAME }}/my-umbot-bot:latest
