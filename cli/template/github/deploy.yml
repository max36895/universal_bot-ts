name: Deploy umbot project

on:
    push:
        branches: [main]

env:
    IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/{{imageName}}

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'

            - name: Install dependencies
              run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

            - name: Run tests
              run: npm test --if-present

            - name: Build project
              run: npm run build

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: ${{ env.IMAGE_NAME }}:latest,${{ env.IMAGE_NAME }}:${{ github.sha }}

            - name: Deploy to server via SSH
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.HOST }}
                  username: ${{ secrets.USERNAME }}
                  key: ${{ secrets.SSH_KEY }}
                  script: |
                      # Секреты передаются через env-файл на сервере, а не флагами -e,
                      # чтобы токены не были видны в `ps` и истории docker.
                      # Создайте /etc/umbot/{{imageName}}.env на сервере заранее (chmod 600).
                      docker stop {{imageName}} || true
                      docker rm {{imageName}} || true
                      docker pull ${{ secrets.DOCKERHUB_USERNAME }}/{{imageName}}:latest
                      docker run -d \
                        --name {{imageName}} \
                        --restart unless-stopped \
                        -p {{port}}:{{port}} \
                        --env-file /etc/umbot/{{imageName}}.env \
                        ${{ secrets.DOCKERHUB_USERNAME }}/{{imageName}}:latest
